<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Product</title>
    <meta name="description" content="WDD 131 - Form Product. Pablo Hermosilla">
    <meta name="author" content="Pablo Hermosilla">
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <!-- 1. Product Name -->
            <label for="productName">Product Name</label>
            <select name="productName" id="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- 2. Overall Rating -->
            <div>Overall Rating</div>
            <div class="stars">
                <label for="onestar"><input type="radio" id="onestar" name="stars" value="1" required>&star;</label>
                <label for="twostar"><input type="radio" id="twostar" name="stars" value="2" required>&star;&star;</label>
                <label for="threestar"><input type="radio" id="threestar" name="stars" value="3" required>&star;&star;&star;</label>
                <label for="fourstar"><input type="radio" id="fourstar" name="stars" value="4" required>&star;&star;&star;&star;</label>
                <label for="fivestar"><input type="radio" id="fivestar" name="stars" value="5" required>&star;&star;&star;&star;&star;</label>
            </div>

            <!-- 3. Date of Installation -->
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>

            <!-- 4. Useful Features -->
            <div>Which features did you find useful in the product? <span>(Check all that apply)</span></div>
            <label for="durability"><input type="checkbox" id="durability" name="features" value="durability"> Durability</label>
            <label for="ease"><input type="checkbox" id="ease" name="features" value="ease"> Ease of Use</label>
            <label for="performance"><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
            <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>

            <!-- 5. Written Review -->
            <label for="review">Written Review <span>(Optional)</span></label>
            <textarea id="review" name="review" rows="4"></textarea>

            <!-- 6. User Name -->
            <label for="userName">Your Name <span>(Optional)</span></label>
            <input type="text" id="userName" name="userName">

            <!-- 7. Submit Button -->
            <input type="submit" value="Post Review">
        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            Pablo Exequiel Hermosilla Fourcade |
            Chile
        </p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
